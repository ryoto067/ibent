<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>とるぞ！同行用ルートマップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Sans", "Hiragino Maru Gothic ProN", sans-serif; color: #1D2B30; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { width: 210mm; height: 297mm; padding: 10mm 12mm; display: flex; flex-direction: column; gap: 4mm; page-break-after: always; overflow: hidden; }
  header { display: flex; align-items: center; gap: 4mm; border-bottom: 1mm solid #0B7488; padding-bottom: 3mm; }
  .team { width: 22mm; height: 22mm; border-radius: 4mm; background: #0B7488; color: #fff; display: grid; place-items: center; text-align: center; line-height: 1; }
  .team small { font-size: 8pt; display: block; }
  .team b { font-size: 26pt; }
  header h1 { font-size: 16pt; color: #0B4F5C; }
  header p { font-size: 9pt; color: #5E6E73; margin-top: 1mm; }
  .map { height: 118mm; border: .4mm solid #BFDDE2; border-radius: 3mm; }
  table { width: 100%; border-collapse: collapse; font-size: 10pt; }
  th { text-align: left; font-size: 8.5pt; color: #5E6E73; font-weight: normal; border-bottom: .3mm solid #BFDDE2; padding: 1mm 2mm; }
  td { padding: 1.8mm 2mm; border-bottom: .3mm solid #E3F0F2; vertical-align: top; }
  td.t { width: 15mm; font-weight: bold; font-variant-numeric: tabular-nums; }
  td.n { width: 9mm; }
  td.c { width: 12mm; text-align: center; }
  .dot { display: inline-grid; place-items: center; width: 6mm; height: 6mm; border-radius: 50%; background: #0B7488; color: #fff; font-size: 8.5pt; font-weight: bold; }
  .dot.s { background: #C99A2E; font-size: 7pt; }
  .box { display: inline-block; width: 5mm; height: 5mm; border: .4mm solid #0B7488; border-radius: 1mm; }
  .spot { font-weight: bold; color: #0B4F5C; }
  .sub { color: #5E6E73; font-size: 8.5pt; }
  .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; font-size: 8.8pt; line-height: 1.5; }
  .notes div { background: #E3F0F2; border-radius: 3mm; padding: 2.5mm 3.5mm; }
  .notes h2 { font-size: 9.5pt; color: #0B4F5C; margin-bottom: 1mm; }
  .notes ul { padding-left: 4mm; }
  .notes .warn { background: #FBF0DA; }
  .pin { width: max-content; min-width: 26px; height: 26px; padding: 0 5px; border-radius: 13px; background: #0B7488; color: #fff; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4);
    display: grid; place-items: center; font: 700 12px/1 "Hiragino Sans", sans-serif; white-space: nowrap; }
  .pin.meet { background: #C99A2E; width: 34px; height: 34px; font-size: 11px; }
  .lbl { background: #fff; border: 1px solid #0B7488; color: #0B4F5C; border-radius: 4px; padding: 1px 4px; font: 700 10px/1.3 "Hiragino Sans", sans-serif; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .leaflet-control-attribution { font-size: 8px !important; }
</style>
</head>
<body>
<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../mission-app/config.js"></script>
<script src="../mission-app/route.js"></script>
<script>
  // アプリ（mission-app/config.js）と同じ設定からチームごとのページを作る
  const CFG = window.TORUZO_CONFIG;
  const hhmm = (d) => d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo' });
  function planFor(no) {
    const start = new Date(CFG.startTime).getTime();
    let t = 0, pos = 0;
    const steps = CFG.teamRoutes[no].map(([mid, key], i) => {
      const spot = CFG.spots[key];
      t += Math.abs(spot.pos - pos); pos = spot.pos;
      const s = { mid, order: i + 1, spot, at: new Date(start + t * 60000) };
      t += CFG.minutesPerMission;
      return s;
    });
    return { steps, back: new Date(start + (t + pos) * 60000) };
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (html, cls, size) => L.divIcon({ className: '', html: '<div class="' + cls + '">' + html + '</div>', iconSize: [size, size], iconAnchor: [size / 2, size / 2] });

  const teams = Object.keys(CFG.teamRoutes).map(Number);
  const root = document.getElementById('pages');
  window.mapsReady = 0;

  teams.forEach((no) => {
    const plan = planFor(no);
    const mp = CFG.meetingPoint;
    const rows = plan.steps.map((s) => `
      <tr><td class="t">${hhmm(s.at)}</td><td class="n"><span class="dot">${s.order}</span></td>
      <td><span class="spot">${esc(s.spot.name)}</span><br>${esc(CFG.missions[s.mid].title)}<br><span class="sub">${esc(CFG.missions[s.mid].desc)}</span></td>
      <td class="c"><span class="box"></span></td></tr>`).join('');
    const page = document.createElement('section');
    page.className = 'page';
    page.innerHTML = `
      <header>
        <div class="team"><div><small>TEAM</small><b>${no}</b></div></div>
        <div><h1>同行用ルートマップ　チーム${no}</h1>
        <p>とるぞ！フォトミッションラリー ｜ 2026.12.13（日）撮影 15:30〜16:20 ｜ アプリ：ibent2.vercel.app/?team=${no}</p></div>
      </header>
      <div class="map" id="map${no}"></div>
      <table>
        <tr><th>目安</th><th></th><th>場所とお題</th><th>済</th></tr>
        <tr><td class="t">${hhmm(new Date(CFG.startTime))}</td><td class="n"><span class="dot s">集</span></td><td><span class="spot">${esc(mp.name)}</span>を出発</td><td class="c"></td></tr>
        ${rows}
        <tr><td class="t">${hhmm(plan.back)}</td><td class="n"><span class="dot s">集</span></td><td><span class="spot">集合場所に戻る</span>（16:20 厳守）</td><td class="c"><span class="box"></span></td></tr>
      </table>
      <div class="notes">
        <div><h2>同行スタッフの役割</h2><ul>
          <li>道案内と時間管理。会話や撮影はチームに任せ、困ったときだけ手伝う</li>
          <li>写真に知らない人の顔が写っていないか確認する</li>
          <li>石垣に登らない・歩きながら撮らないを声かけする</li>
        </ul></div>
        <div class="warn"><h2>時間と連絡</h2><ul>
          <li>目安より10分以上遅れたら、残りのお題を飛ばして戻る</li>
          <li><b>16:15</b> には必ず帰り始める（集合場所まで約8分）</li>
          <li>運営LINEに、スポットに着くたび現在地を送る</li>
        </ul></div>
      </div>`;
    root.appendChild(page);

    const map = L.map('map' + no, { zoomControl: false, attributionControl: true, zoomSnap: 0.25, fadeAnimation: false, zoomAnimation: false });
    const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
    tiles.on('load', () => { window.mapsReady++; });
    L.polyline(window.TORUZO_ROUTE, { color: '#0B7488', weight: 7, opacity: 0.85 }).addTo(map);
    L.marker([mp.lat, mp.lng], { icon: icon('集合', 'pin meet', 34) }).addTo(map);
    const bySpot = new Map();
    plan.steps.forEach((s) => {
      if (!bySpot.has(s.spot.name)) bySpot.set(s.spot.name, { spot: s.spot, nums: [] });
      bySpot.get(s.spot.name).nums.push(s.order);
    });
    bySpot.forEach((g) => {
      L.marker([g.spot.lat, g.spot.lng], { icon: icon(g.nums.join('・'), 'pin', 26) }).addTo(map);
      L.marker([g.spot.lat, g.spot.lng], { icon: L.divIcon({ className: '', html: '<div class="lbl">' + esc(g.spot.name.replace(/（.*）/, '')) + '</div>', iconSize: null, iconAnchor: [-(12 + g.nums.join('・').length * 6), 8] }) }).addTo(map);
    });
    map.fitBounds(L.latLngBounds(window.TORUZO_ROUTE.concat([[mp.lat, mp.lng]])), { padding: [30, 30] });
  });
</script>
</body>
</html>
